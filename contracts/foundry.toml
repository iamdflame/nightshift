[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["dependencies"]
solc_version = "0.8.33"
# BSC supports Cancun (Tycho hardfork). Pinned explicitly so a newer solc default (prague/osaka) never
# emits opcodes the chain does not have.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 1000
seed = "0x6e696768747368696674"

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false

# Heavier campaign: FOUNDRY_PROFILE=deep forge test
[profile.deep.fuzz]
runs = 20000

[profile.deep.invariant]
runs = 1024
depth = 256
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

[dependencies]
forge-std = "1.17.0"
"@openzeppelin-contracts" = "5.7.0"

[soldeer]
remappings_generate = true
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"
recursive_deps = false
